<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Socket.IO Real-time Test</title>
    <style>
      body {
        font-family: sans-serif;
        padding: 20px;
        line-height: 1.6;
      }
      #status {
        font-weight: bold;
        padding: 5px 10px;
        border-radius: 4px;
        display: inline-block;
      }
      .connected {
        background-color: #d4edda;
        color: #155724;
      }
      .disconnected {
        background-color: #f8d7da;
        color: #721c24;
      }
      #notification-list {
        margin-top: 20px;
        border: 1px solid #ddd;
        padding: 10px;
        list-style: none;
        max-height: 300px;
        overflow-y: auto;
      }
      .noti-item {
        border-bottom: 1px solid #eee;
        padding: 10px 0;
      }
      .noti-item:last-child {
        border-bottom: none;
      }
      .time {
        font-size: 0.8em;
        color: #888;
      }
    </style>
  </head>
  <body>
    <h1>🔔 실시간 알림 테스트 패널</h1>

    <div>상태: <span id="status" class="disconnected">연결 안 됨</span></div>

    <form id="form" style="margin-top: 20px">
      <input
        type="text"
        id="token"
        placeholder="JWT Access Token"
        style="width: 300px; padding: 8px"
      />
      <button id="connect" style="padding: 8px 15px; cursor: pointer">Connect</button>
    </form>

    <h3>수신된 알림 목록</h3>
    <ul id="notification-list">
      <li id="empty-msg">아직 수신된 알림이 없습니다.</li>
    </ul>

    <script src="https://cdn.socket.io/4.7.4/socket.io.min.js"></script>
    <script>
      const form = document.getElementById('form');
      const tokenInput = document.getElementById('token');
      const statusEl = document.getElementById('status');
      const notiList = document.getElementById('notification-list');
      const emptyMsg = document.getElementById('empty-msg');

      form.addEventListener('submit', (e) => {
        e.preventDefault();
        const accessToken = tokenInput.value.trim();

        if (window.socket) window.socket.disconnect();

        // 소켓 연결
        window.socket = io('http://localhost:3000', {
          auth: { accessToken },
        });

        // 연결 성공
        window.socket.on('connect', () => {
          statusEl.innerText = '✅ 연결됨';
          statusEl.className = 'connected';
          console.log('Connected! ID:', window.socket.id);
        });

        // 연결 실패
        window.socket.on('connect_error', (err) => {
          statusEl.innerText = '❌ 연결 에러: ' + err.message;
          statusEl.className = 'disconnected';
        });

        // 알림 수신 (이게 핵심!)
        window.socket.on('notification', (data) => {
          console.log('Notification Received:', data);
          if (emptyMsg) emptyMsg.remove();

          const li = document.createElement('li');
          li.className = 'noti-item';

          // 데이터 구조에 따라 메시지 표시 (message 또는 content)
          const message = data.message || data.content || '새로운 알림이 있습니다.';
          const time = new Date().toLocaleTimeString();

          li.innerHTML = `
            <strong>[${data.type}]</strong> ${message} <br>
            <span class="time">${time}</span>
          `;

          notiList.prepend(li); // 최신 알림이 위로 오게
        });
      });
    </script>
  </body>
</html>

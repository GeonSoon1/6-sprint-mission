name: CI/CD Pipeline

on:
  push:
    branches: [ "master" ] 
  pull_request:
    branches: [ "master" ] 

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: testdb
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/testdb
      JWT_ACCESS_TOKEN_SECRET: test-access-token-secret-key-123
      JWT_REFRESH_TOKEN_SECRET: test-refresh-token-secret-key-123
      AWS_REGION: ap-northeast-2
      AWS_ACCESS_KEY_ID: dummy-access-key
      AWS_SECRET_ACCESS_KEY: dummy-secret-key
      AWS_S3_BUCKET_NAME: dummy-bucket-name

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          
      - name: Install dependencies
        run: npm install
        
      - name: Prisma Client Generate
        run: npx prisma generate

      - name: Apply DB Schema
        run: npx prisma db push

      - name: Run Jest Tests
        run: NODE_OPTIONS=--experimental-vm-modules npm test

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}        
          username: ${{ secrets.EC2_USER }}       
          key: ${{ secrets.EC2_PRIVATE_KEY }}  
          script: |
            cd /home/ec2-user/new_github_action
            
            # 1. 최신 코드 가져오기
            git pull origin master
            
            # 2. 패키지 설치
            npm install
            
            # 3. Prisma 설정 최신화
            npx prisma generate
            npx prisma migrate deploy
            
            # 4. PM2 무중단 재시작 (확장자를 .cjs로 변경했습니다)
            pm2 reload infra/ec2/ecosystem.config.cjs || pm2 start infra/ec2/ecosystem.config.cjs
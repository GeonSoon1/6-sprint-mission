name: test and deploy

on:
  push:
    branches:
      - 나영준-sprint11 # 나영준-psrint11 브랜치에 푸시될 때 실행
  pull_request:
    branches:
      - main
jobs:
  test:
    runs-on: ubuntu-latest # GitHub에서 제공하는 Ubuntu 리눅스 머신에서 실행

    # PostgreSQL 서비스를 Docker 컨테이너로 함께 실행
    services:
      postgres:
        image: postgres:15 # PostgreSQL 15 버전 사용
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: testdb
        ports:
          - 5432:5432 # 로컬에서 5432 포트를 통해 접근 가능
        options: >- # DB가 준비될 때까지 기다리는 설정 (헬스 체크)
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/testdb
      JWT_ACCESS_TOKEN_SECRET: test_access_secret
      JWT_REFRESH_TOKEN_SECRET: test_refresh_secret
      PORT: 3000
      BASE_URL: http://localhost:3000
    steps:
      - name: Checkout code
        uses: actions/checkout@v3 # GitHub 저장소의 코드를 가져옴

      - name: Set up Node.js
        uses: actions/setup-node@v3 # Node.js 실행 환경을 설치
        with:
          node-version: lts/* # 또는 프로젝트에 필요한 Node.js 버전

      - name: Install dependencies
        run: npm ci # 프로젝트 의존성 설치

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Apply DB Schema
        run: npm run prisma:deploy # Prisma 마이그레이션 적용 (testdb에 스키마 반영)

      - name: Type Check
        run: npm run typecheck # TypeScript 타입 검사 수행

      - name: Run Tests
        run: npm run test:ci -- --runInBand # 테스트 실행 (예: Jest, Supertest 등 포함)
